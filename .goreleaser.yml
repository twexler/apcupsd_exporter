---
version: 2
project_name: apcupsd_exporter

before:
  hooks:
    - go mod download

builds:
  - id: apcupsd_exporter
    main: ./cmd/apcupsd_exporter/main.go
    binary: apcupsd_exporter
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
      - zip
      - binary

release:
  github:
    owner: twexler
    name: apcupsd_exporter

dockers_v2:
  - images:
      - "ghcr.io/twexler/apcupsd_exporter"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
      - latest
    labels:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.source: "{{.GitURL}}"
